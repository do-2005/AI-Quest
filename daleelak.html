<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>دليلك | Daleelak</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf9f4;--card:#fffefb;--ink:#1b3f5c;--tx:#2b3440;--mut:#6b7280;--ln:#e6e1d6;--g:#3d7a54;--gb:#e8f0e6;--b:#2f6f9f;--bb:#e6edf3;--r:#c0392b;--rb:#fbe3df;--y:#b98a00;--yb:#f7ecbd;--yt:#7a5c00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14202b;--card:#1b2a37;--ink:#cfe3f5;--tx:#e4e9ee;--mut:#9aa7b4;--ln:#2d3f50;--gb:#1f3328;--bb:#1d3042;--rb:#3b2220;--yb:#3b3418;--yt:#f0d675}}
:root[data-theme=dark]{--bg:#14202b;--card:#1b2a37;--ink:#cfe3f5;--tx:#e4e9ee;--mut:#9aa7b4;--ln:#2d3f50;--gb:#1f3328;--bb:#1d3042;--rb:#3b2220;--yb:#3b3418;--yt:#f0d675}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 Tajawal,Tahoma,sans-serif}
.demo{background:var(--yb);color:var(--yt);text-align:center;font-size:13px;padding:6px 10px}
nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 5%;background:var(--card);border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:10px;margin-inline-end:auto;cursor:pointer}.logo img{height:52px;width:auto;border-radius:8px;background:#fff}
.logo b{font-size:24px;color:var(--ink);display:block;line-height:1}.logo small{color:var(--mut);font-size:12px}
nav a{padding:6px 12px;border-radius:8px;font-weight:700;color:var(--ink);cursor:pointer;font-size:15px}nav a:hover{background:var(--bb)}
.bn{display:block;width:100%;max-height:340px;object-fit:cover;object-position:center}
.wrap{max-width:1100px;margin:0 auto;padding:28px 5% 50px}
h2{color:var(--ink);font-size:28px;margin:4px 0 6px}.g{color:var(--g)}.mut{color:var(--mut)}.eb{color:var(--g);font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:24px;box-shadow:0 8px 24px #0001}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:14px;color:var(--ink)}
input,select,textarea{width:100%;font:inherit;padding:10px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx)}
.btn{font:inherit;font-weight:700;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:11px 22px;border-radius:10px;cursor:pointer;margin-top:14px}
.btn.o{background:transparent;color:var(--ink)}.btn.r{background:var(--r);border-color:var(--r)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-visible,.chip:focus-visible,.path:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.note{background:var(--yb);color:var(--yt);border:1px solid #e8d37a;border-radius:10px;padding:10px 14px;font-size:14px;margin:12px 0}.er{color:var(--r);min-height:26px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:22px 0}
.path{border-radius:16px;padding:26px;cursor:pointer;border:1px solid;min-height:170px;transition:transform .15s;text-align:start;font:inherit;display:block;width:100%}.path:hover{transform:translateY(-3px)}
.path small{font-weight:700}.path h3{font-size:24px;margin:8px 0;color:var(--ink)}.path p{margin:0;font-size:14px;color:var(--mut)}
.pg{background:var(--gb);border-color:#b9d3bd;color:var(--g)}.pb{background:var(--bb);border-color:#b7cddf;color:var(--b)}.pr{background:var(--rb);border-color:#eab2aa;color:var(--r)}.py{background:var(--yb);border-color:#e8d37a;color:var(--y)}
.chat{height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(6px)}}@media(prefers-reduced-motion:reduce){.m,.path{animation:none;transition:none}.spin{animation-duration:3s}}
.bot{background:var(--bb);align-self:flex-start;border-start-start-radius:2px}.me{background:var(--ink);color:#fff;align-self:flex-end;border-start-end-radius:2px}
.res ul{margin:4px 0;padding-inline-start:22px}.res p{margin:8px 0 2px}
.qr{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{font:inherit;font-weight:700;padding:8px 16px;border-radius:99px;border:1.5px solid;cursor:pointer;background:var(--card)}
.c0{color:var(--g);border-color:var(--g)}.c1{color:var(--b);border-color:var(--b)}.c2{color:var(--r);border-color:var(--r)}.c3{color:var(--y);border-color:var(--y)}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt{display:block;width:100%;text-align:start;font:inherit;padding:11px 14px;margin:6px 0;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);cursor:pointer}.opt.on{border-color:var(--g);background:var(--gb);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.steps{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 18px;font-weight:700;color:var(--mut)}.steps .on{color:var(--g)}
.wit{border:1px dashed var(--b);border-radius:12px;padding:6px 14px 14px;margin-top:12px}
.tw{overflow-x:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:820px;font-size:14px}th{background:var(--bb);text-align:start;padding:10px;color:var(--ink)}td{padding:10px;border-top:1px solid var(--ln);vertical-align:top}table.rv{min-width:0}
.bd{display:inline-block;padding:2px 12px;border-radius:99px;font-weight:700;font-size:13px;white-space:nowrap}.l3{background:var(--rb);color:var(--r)}.l2{background:var(--yb);color:var(--yt)}.l1{background:var(--gb);color:var(--g)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}.stat{border-radius:14px;padding:14px 18px;border:1px solid}.stat b{font-size:30px;display:block;line-height:1.2}
tr.new td{background:var(--gb)}.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--b);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
footer{background:var(--bb);padding:20px 5%;color:var(--mut);font-size:13px;text-align:center}
@media(max-width:760px){.two,.three{grid-template-columns:1fr}.logo small{display:none}}
</style></head><body><div class="demo" id=dm></div><div id="nv"></div><div id="app"></div><footer id=ft></footer>
